name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mano8/astro-media-m8

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # A release publishes the tree its tag points at, so the tag must name the
      # version that tree declares, or npm and the GitHub release disagree.
      - name: Verify the release tag names the package version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag $TAG does not name package.json version $version"
            exit 1
          fi

      # `B37-publish-lock-guard` (`G36`): this job builds the tarball from what
      # it installs, and a `v*` tag need not sit on a commit CI verified, so it
      # refuses an unpinned lock itself rather than trusting CI.yaml to have.
      - name: Lock integrity
        run: npm run verify:lock-integrity

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Select npm dist tag
        id: dist-tag
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
          else
            tag="latest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify npm package contents
        run: npm pack --dry-run

      # Only a published release reaches npm. A manual dispatch rehearses the
      # publish with --dry-run, as the Docker workflows build with push: false
      # on dispatch; the npm environment's v* tag policy is the platform half
      # of the same rule.
      - name: Publish to npm with Trusted Publishing
        if: github.event_name == 'release'
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Rehearse the publish (manual dispatch)
        if: github.event_name != 'release'
        run: npm publish --dry-run --access public --tag "${{ steps.dist-tag.outputs.tag }}"
